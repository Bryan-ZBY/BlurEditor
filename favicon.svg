<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect x="5" y="5" width="90" height="90" rx="15" fill="url(#bg)" stroke="url(#accent)" stroke-width="3"/>
  
  <!-- 编辑器线条 -->
  <rect x="20" y="25" width="60" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>
  <rect x="20" y="38" width="45" height="3" rx="1.5" fill="#67e8f9" opacity="0.9"/>
  <rect x="20" y="48" width="55" height="3" rx="1.5" fill="#67e8f9" opacity="0.75"/>
  <rect x="20" y="58" width="40" height="3" rx="1.5" fill="#67e8f9" opacity="0.85"/>
  <rect x="20" y="68" width="50" height="3" rx="1.5" fill="#67e8f9" opacity="0.7"/>
  
  <!-- 光标 -->
  <rect x="72" y="38" width="3" height="12" fill="#fb7185" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>