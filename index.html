<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Private Editor</title>
        <script type="module" src="./tailwindcss.min.js"></script>
        <script type="module" src="./tailwind.config.js"></script>
        <link rel="stylesheet" href="./style.css">
    </head>

    <body class="relative">
        <textarea 
            id="editor" 
            class="fullscreen bg-editor-bg text-editor-text font-mono text-sm md:text-base p-6 md:p-10 blur-effect" 
            placeholder="点击开始输入内容... (双击ESC键退出编辑)"></textarea>
        <!-- 在body标签内添加提示组件 (放在textarea下方即可) -->
        <div id="save-toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-2 opacity-0 transition-all duration-300 translate-y-[-20px] z-50">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <span>保存成功！内容已更新到历史记录</span>
        </div>

        <!-- 收藏提示 -->
        <div id="favorite-toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-2 opacity-0 transition-all duration-300 translate-y-[-20px] z-50">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
            </svg>
            <span>已添加到收藏！</span>
        </div>

        <!-- 状态栏 -->
        <div id="statusbar" class="statusbar absolute bottom-0 left-0 right-0 bg-statusbar-bg text-editor-text font-mono text-xs px-4 py-2 flex justify-between items-center border-t border-gray-800">
            <div class="flex space-x-4">
                <span id="char-count">0 字符</span>
                <span id="word-count">0 单词</span>
                <span id="line-count">1 行</span>
            </div>
            <div class="flex space-x-4">
                <span id="cursor-position">行:1, 列:0</span>
                <span id="last-saved">未保存</span>
                <button id="show-history" class="text-editor-accent hover:underline">历史记录</button>
                <button id="show-favorites" class="text-favorite-accent hover:underline">收藏列表</button>
            </div>
        </div>

        <!-- 历史记录/收藏面板 -->
        <div id="history-panel" class="history-panel fixed top-0 right-0 bottom-0 bg-history-bg text-editor-text font-mono text-sm p-4 overflow-hidden border-l border-gray-800 z-10">
            <div class="flex justify-between items-center mb-4">
                <div class="flex space-x-2">
                    <button id="history-tab" class="tab-btn active">历史记录</button>
                    <button id="favorites-tab" class="tab-btn">收藏列表</button>
                </div>
                <button id="close-history" class="text-gray-400 hover:text-white text-sm">关闭</button>
            </div>
            
            <div id="history-tab-content" class="tab-content active">
                <div id="history-list" class="space-y-3 pr-2"></div>
            </div>
            
            <div id="favorites-tab-content" class="tab-content">
                <div id="favorite-list" class="space-y-3 pr-2"></div>
            </div>
        </div>

        <!-- 历史记录预览模态框 -->
        <div id="history-modal" class="modal fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-20 p-4">
            <div class="bg-modal-bg rounded-lg modal-content w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden border border-gray-700">
                <div class="flex justify-between items-center p-4 bg-modal-content-bg border-b border-gray-700">
                    <h3 class="text-lg font-bold text-gray-200" id="modal-title">历史记录预览</h3>
                    <button id="close-modal" class="text-gray-400 hover:text-white text-xl">&times;</button>
                </div>
                <div id="history-preview" class="flex-1 overflow-y-auto p-4 bg-modal-content-bg font-mono text-sm text-gray-200"></div>
                <div class="flex justify-between items-center p-4 bg-modal-content-bg border-t border-gray-700">
                    <div class="text-xs text-gray-400" id="history-time"></div>
                    <div class="flex space-x-3">
                        <button id="copy-content" class="copy-btn border border-gray-600 px-4 py-2 rounded text-sm font-medium hover:bg-gray-700 transition flex items-center space-x-1">
                            <span>复制</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                        </button>
                        <button id="delete-history" class="delete-btn px-4 py-2 rounded text-sm font-medium">删除记录</button>
                        <button id="apply-history" class="bg-editor-accent px-4 py-2 rounded text-sm font-medium hover:bg-blue-600 transition">应用到编辑器</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 收藏预览模态框 -->
        <div id="favorite-modal" class="modal fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-20 p-4">
            <div class="bg-modal-bg rounded-lg modal-content w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden border border-gray-700">
                <div class="flex justify-between items-center p-4 bg-modal-content-bg border-b border-gray-700">
                    <h3 class="text-lg font-bold text-gray-200" id="favorite-modal-title">收藏预览</h3>
                    <button id="close-favorite-modal" class="text-gray-400 hover:text-white text-xl">&times;</button>
                </div>
                <div id="favorite-preview" class="flex-1 overflow-y-auto p-4 bg-modal-content-bg font-mono text-sm text-gray-200"></div>
                <div class="flex justify-between items-center p-4 bg-modal-content-bg border-t border-gray-700">
                    <div class="text-xs text-gray-400" id="favorite-time"></div>
                    <div class="flex space-x-3">
                        <button id="copy-favorite" class="copy-btn border border-gray-600 px-4 py-2 rounded text-sm font-medium hover:bg-gray-700 transition flex items-center space-x-1">
                            <span>复制</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                        </button>
                        <button id="delete-favorite" class="delete-btn px-4 py-2 rounded text-sm font-medium">删除收藏</button>
                        <button id="apply-favorite" class="bg-editor-accent px-4 py-2 rounded text-sm font-medium hover:bg-blue-600 transition">应用到编辑器</button>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="./app.js"></script>
    </body>
</html>
